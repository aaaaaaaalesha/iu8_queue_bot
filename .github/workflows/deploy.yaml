name: deploy

# Manual only for now: Actions -> deploy -> Run workflow (see deploy/README.md).
on:
  workflow_dispatch:

# Never run two deploys at once; a newer run waits for the current one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  APP_DIR: /opt/queue-bot

jobs:
  checks:
    uses: ./.github/workflows/main.yaml

  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - name: Image reference
        id: ref
        # GHCR requires lowercase names.
        run: echo "image=${IMAGE,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Both x86-64 and ARM servers are supported.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.ref.outputs.image }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        env:
          TELE_API_TOKEN: ${{ secrets.TELE_API_TOKEN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in TELE_API_TOKEN DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set in the 'production' environment"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Host key pinning: the connection fails if the server key changes.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload configuration
        env:
          TELE_API_TOKEN: ${{ secrets.TELE_API_TOKEN }}
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          ssh_opts=(-i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp "${ssh_opts[@]}" deploy/docker-compose.yml deploy/remote-deploy.sh "$TARGET:$APP_DIR/"
          # The token goes through stdin only: it never appears in a command line or in logs.
          # shellcheck disable=SC2029 # APP_DIR is meant to expand locally
          printf 'TELE_API_TOKEN=%s\nLOG_LEVEL=INFO\n' "$TELE_API_TOKEN" \
            | ssh "${ssh_opts[@]}" "$TARGET" "umask 077 && cat > '$APP_DIR/.env'"

      - name: Restart the bot
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          BOT_IMAGE: ${{ needs.image.outputs.image }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh_opts=(-i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes)
          # shellcheck disable=SC2029 # the arguments are meant to expand locally
          printf '%s\n' "$REGISTRY_TOKEN" \
            | ssh "${ssh_opts[@]}" "$TARGET" "bash '$APP_DIR/remote-deploy.sh' '$BOT_IMAGE' '$REGISTRY_USER'"
